# Dedicated empty database for the full automated suite.
# Keeps the phone QA database on port 3307 intact.
services:
  db-check:
    image: mariadb:${MARIADB_IMAGE_TAG:-12.3.2}
    container_name: trend-leader-db-check
    environment:
      MARIADB_DATABASE: ${TEST_DB_NAME:?TEST_DB_NAME is required}
      MARIADB_USER: ${TEST_DB_USER:?TEST_DB_USER is required}
      MARIADB_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD:?TEST_DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
