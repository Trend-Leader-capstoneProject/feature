name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Ruff + pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:12.3.2
        env:
          MARIADB_DATABASE: trend_leader_test
          MARIADB_USER: trend_ci
          MARIADB_PASSWORD: ci-test-only-password
          MARIADB_ROOT_PASSWORD: ci-root-test-only-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
    env:
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
      TEST_DATABASE_URL: mysql+pymysql://trend_ci:ci-test-only-password@127.0.0.1:3307/trend_leader_test?charset=utf8mb4
      TEST_MIGRATION_ALLOWED_HOST: 127.0.0.1
      TEST_MIGRATION_ALLOWED_PORT: '3307'
      TEST_MIGRATION_ALLOWED_DATABASE: trend_leader_test
      TEST_MIGRATION_ALLOWED_USER: trend_ci
      DEMO_SEED_ALLOWED_HOST: 127.0.0.1
      DEMO_SEED_ALLOWED_PORT: '3307'
      DEMO_SEED_ALLOWED_DATABASE: trend_leader_test
      DEMO_SEED_ALLOWED_CURRENT_USER: trend_ci@%
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: python -m ruff check .
      - name: Backend regression (isolated suites excluded)
        working-directory: backend
        run: >-
          python -m pytest -q
          --ignore=tests/responses_web_search
          --ignore=tests/responses_web_search_s1
          --ignore=tests/l2_lock

  frontend:
    name: Frontend / TypeScript + Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Jest
        working-directory: frontend
        run: npm test -- --runInBand

  s0-s1:
    name: S0 / S1 isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: python -m pip install pytest
      - name: S0 (separate Python process)
        working-directory: backend
        run: >-
          python -m pytest tests/responses_web_search
          --confcutdir=tests/responses_web_search
          --import-mode=importlib
          -p no:cacheprovider --tb=short -q
      - name: S1 (separate Python process)
        working-directory: backend
        run: >-
          python -m pytest tests/responses_web_search_s1
          --confcutdir=tests/responses_web_search_s1
          --import-mode=importlib
          -p no:cacheprovider --tb=short -q
